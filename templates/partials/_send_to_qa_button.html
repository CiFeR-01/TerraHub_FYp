{% if b and perms.core.request_qa and b.status == 'Active' or b and perms.core.request_qa and b.status == 'Quarantined' %}<button type="button" title="Send batch {{ b.batch_number }} to QA" onclick="event.stopPropagation(); openSendToQA('{{ b.id }}', '{{ b.batch_number|escapejs }}', '{{ b.quantity }}', '{% if b.material_id %}{{ b.material.unit_of_measure|escapejs }}{% else %}units{% endif %}');" style="margin-left:0.4rem; font-size:0.7rem; padding:0.1rem 0.45rem; border-radius:4px; border:1px solid var(--border-light); background:var(--bg-surface); color:var(--text-muted); cursor:pointer;">Send to QA</button>{% endif %}
