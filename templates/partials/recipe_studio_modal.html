<!-- Modal: Interactive Recipe Studio -->
<div id="recipe-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15,23,42,0.5); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:#fff; border-radius:12px; width:100%; max-width:760px; padding:1.75rem; box-shadow:0 20px 25px -5px rgba(0,0,0,0.1); max-height:92vh; overflow-y:auto;">
        
        <!-- Header & Product Switcher -->
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem; padding-bottom:1rem; border-bottom:1px solid var(--border-light);">
            <div>
                <span style="font-size:0.75rem; font-weight:700; text-transform:uppercase; color:var(--primary); letter-spacing:0.5px;">BOM Studio</span>
                <h3 style="font-family:'Outfit', sans-serif; font-size:1.3rem; font-weight:700; margin-top:0.15rem;" id="studio_title">Product Recipe Studio</h3>
            </div>
            <div style="display:flex; align-items:center; gap:0.75rem;">
                <select id="studio_product_select" onchange="switchStudioProduct(this.value)" class="form-select" style="padding:0.45rem 0.75rem; border-radius:6px; border:1px solid var(--border-light); font-size:0.85rem; font-weight:600; background:#f8fafc;">
                    <option value="">Select Target Product...</option>
                    {% for p in products %}
                    <option value="{{ p.id }}">{{ p.sku }} — {{ p.name }}</option>
                    {% endfor %}
                </select>
                <button onclick="document.getElementById('recipe-modal').style.display='none'" style="background:none; border:none; font-size:1.35rem; cursor:pointer; color:var(--text-muted);">&times;</button>
            </div>
        </div>

        <!-- Section 1: Live Existing Materials Table -->
        <div style="margin-bottom:1.5rem;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
                <label style="font-size:0.875rem; font-weight:700; color:var(--text-main);">Current Assigned Raw Materials</label>
                <span id="recipe_summary_stats" style="font-size:0.8rem; font-weight:600; color:var(--primary);"></span>
            </div>
            
            <div style="background:#f8fafc; border:1px solid var(--border-light); border-radius:8px; overflow:hidden;">
                <table style="width:100%; border-collapse:collapse; font-size:0.825rem;">
                    <thead>
                        <tr style="background:#e2e8f0; text-align:left; color:var(--text-muted);">
                            <th style="padding:0.55rem 0.85rem;">SKU</th>
                            <th style="padding:0.55rem 0.85rem;">Raw Material</th>
                            <th style="padding:0.55rem 0.85rem;">Req Qty</th>
                            <th style="padding:0.55rem 0.85rem;">Unit Cost</th>
                            <th style="padding:0.55rem 0.85rem;">Total Cost</th>
                            <th style="padding:0.55rem 0.85rem; text-align:right;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="existing_recipe_tbody">
                        <tr>
                            <td colspan="6" style="padding:1.5rem; text-align:center; color:var(--text-muted);">Select a product above to view its recipe ingredients.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Section 2: Batch Add New Material Requirements -->
        <div style="margin-bottom:1.5rem; background:#f1f5f9; border-radius:8px; padding:1.15rem; border:1px solid #cbd5e1;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem;">
                <label style="font-size:0.85rem; font-weight:700; color:var(--text-main);">➕ Add New Material Requirement(s)</label>
                <button type="button" onclick="addBatchMaterialRow()" class="btn btn-secondary" style="padding:0.25rem 0.6rem; font-size:0.75rem; background:#fff;">
                    + Add Another Row
                </button>
            </div>

            <div id="batch_material_rows_container" style="display:flex; flex-direction:column; gap:0.6rem;">
                <div class="batch-row" style="display:grid; grid-template-columns: 2fr 1fr 30px; gap:0.5rem; align-items:center;">
                    <select class="form-select batch-mat-id" style="width:100%; padding:0.45rem; border-radius:6px; border:1px solid var(--border-light); font-size:0.825rem; background:#fff;">
                        <option value="">Choose Raw Material...</option>
                        {% for m in materials %}
                        <option value="{{ m.id }}">{{ m.sku }} — {{ m.name }} ({{ m.unit_of_measure }})</option>
                        {% endfor %}
                    </select>
                    <input type="number" step="0.01" min="0.01" placeholder="Quantity" class="form-input batch-mat-qty" style="width:100%; padding:0.45rem; border-radius:6px; border:1px solid var(--border-light); font-size:0.825rem; background:#fff;">
                    <button type="button" onclick="removeBatchRow(this)" style="background:none; border:none; color:#dc2626; cursor:pointer; font-weight:700;">&times;</button>
                </div>
            </div>

            <div style="margin-top:0.85rem; display:flex; justify-content:flex-end;">
                <button type="button" onclick="saveBatchRecipe()" class="btn btn-primary" style="padding:0.45rem 1rem; font-size:0.825rem;">
                    Save Recipe Requirement(s)
                </button>
            </div>
        </div>

        <!-- Section 3: Recipe Cloning Utility -->
        <div style="background:#fff; border:1px dashed var(--border-light); border-radius:8px; padding:1rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.75rem;">
            <div>
                <div style="font-size:0.825rem; font-weight:700;">👯 Copy Recipe from Existing Product</div>
                <div style="font-size:0.75rem; color:var(--text-muted);">Duplicate all material requirements from another product into this recipe.</div>
            </div>
            <div style="display:flex; gap:0.5rem; align-items:center;">
                <select id="clone_source_select" class="form-select" style="padding:0.45rem 0.65rem; border-radius:6px; border:1px solid var(--border-light); font-size:0.8rem; background:#f8fafc;">
                    <option value="">Select source product to clone...</option>
                    {% for p in products %}
                    <option value="{{ p.id }}">{{ p.sku }} — {{ p.name }}</option>
                    {% endfor %}
                </select>
                <button type="button" onclick="cloneRecipe()" class="btn btn-secondary" style="padding:0.45rem 0.85rem; font-size:0.8rem;">
                    Copy Recipe
                </button>
            </div>
        </div>

    </div>
</div>

<script>
// ----------------------------------------------------
// RECIPE STUDIO INTERACTIVE FUNCTIONS
// ----------------------------------------------------
var currentStudioProductId = null;

function openRecipeStudio(productId) {
    document.getElementById('recipe-modal').style.display = 'flex';
    var select = document.getElementById('studio_product_select');
    
    if (productId) {
        select.value = productId;
    } else if (select.options.length > 1) {
        select.selectedIndex = 1;
    }
    
    if (select.value) {
        switchStudioProduct(select.value);
    }
}

function switchStudioProduct(productId) {
    if (!productId) return;
    currentStudioProductId = productId;

    fetch("/catalog/products/" + productId + "/recipe/get/")
    .then(r => r.json())
    .then(data => {
        if (!data.success) return;
        
        document.getElementById('studio_title').innerText = "Recipe Studio — [" + data.product_sku + "] " + data.product_name;
        document.getElementById('recipe_summary_stats').innerText = "Est. Cost: {{ system_settings.base_currency_symbol }}" + data.total_cost.toFixed(2) + " | Total Wt: " + data.total_weight.toFixed(4) + " MT";

        var tbody = document.getElementById('existing_recipe_tbody');
        tbody.innerHTML = '';

        if (data.recipe_items.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="padding:1.5rem; text-align:center; color:var(--text-muted);">No materials assigned to this recipe yet. Add one below!</td></tr>';
            return;
        }

        data.recipe_items.forEach(item => {
            var tr = document.createElement('tr');
            tr.style.borderBottom = '1px solid #cbd5e1';
            tr.innerHTML = `
                <td style="padding:0.55rem 0.85rem; font-weight:700; color:var(--primary);">${item.material_sku}</td>
                <td style="padding:0.55rem 0.85rem; font-weight:600;">${item.material_name}</td>
                <td style="padding:0.55rem 0.85rem; font-weight:700;">${item.quantity_required} ${item.unit_of_measure}</td>
                <td style="padding:0.55rem 0.85rem;">{{ system_settings.base_currency_symbol }}${item.cost_per_unit.toFixed(2)}</td>
                <td style="padding:0.55rem 0.85rem; font-weight:700; color:#059669;">{{ system_settings.base_currency_symbol }}${item.total_cost.toFixed(2)}</td>
                <td style="padding:0.55rem 0.85rem; text-align:right;">
                    <button type="button" onclick="deleteRecipeItem(${item.id})" style="background:#fee2e2; color:#dc2626; border:none; border-radius:4px; padding:0.25rem 0.5rem; cursor:pointer; font-weight:700; font-size:0.75rem;" title="Delete item">
                        🗑 Delete
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    });
}

function deleteRecipeItem(recipeId) {
    if (!confirm('Remove this material requirement from the recipe?')) return;
    
    var formData = new FormData();
    formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');
    formData.append('action', 'delete_item');
    formData.append('recipe_id', recipeId);

    fetch("{% url 'save_product_recipe_api' %}", {
        method: 'POST',
        body: formData
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            switchStudioProduct(currentStudioProductId);
            // Optionally reload the page to reflect updated recipe if viewing a detail page
            if (window.location.pathname.includes('/catalog/products/') && !window.location.pathname.endsWith('/products/')) {
                window.location.reload();
            }
        } else {
            alert('Error deleting item: ' + data.error);
        }
    });
}

function addBatchMaterialRow() {
    var container = document.getElementById('batch_material_rows_container');
    var firstRow = container.querySelector('.batch-row');
    if (!firstRow) return;
    var newRow = firstRow.cloneNode(true);
    newRow.querySelector('.batch-mat-id').value = '';
    newRow.querySelector('.batch-mat-qty').value = '';
    container.appendChild(newRow);
}

function removeBatchRow(btn) {
    var container = document.getElementById('batch_material_rows_container');
    if (container.querySelectorAll('.batch-row').length > 1) {
        btn.closest('.batch-row').remove();
    } else {
        var row = btn.closest('.batch-row');
        row.querySelector('.batch-mat-id').value = '';
        row.querySelector('.batch-mat-qty').value = '';
    }
}

function saveBatchRecipe() {
    if (!currentStudioProductId) {
        alert('Please select a target product first.');
        return;
    }

    var matSelects = document.querySelectorAll('.batch-mat-id');
    var qtyInputs = document.querySelectorAll('.batch-mat-qty');

    var formData = new FormData();
    formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');
    formData.append('action', 'save_batch');
    formData.append('product_id', currentStudioProductId);

    var count = 0;
    for (var i = 0; i < matSelects.length; i++) {
        var mVal = matSelects[i].value;
        var qVal = qtyInputs[i].value;
        if (mVal && qVal && parseFloat(qVal) > 0) {
            formData.append('material_ids[]', mVal);
            formData.append('quantities[]', qVal);
            count++;
        }
    }

    if (count === 0) {
        alert('Please select at least one material and enter a valid quantity.');
        return;
    }

    fetch("{% url 'save_product_recipe_api' %}", {
        method: 'POST',
        body: formData
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            matSelects.forEach(s => s.value = '');
            qtyInputs.forEach(q => q.value = '');
            switchStudioProduct(currentStudioProductId);
            // Optionally reload page to show new recipe in product detail page
            if (window.location.pathname.includes('/catalog/products/') && !window.location.pathname.endsWith('/products/')) {
                window.location.reload();
            }
        } else {
            alert('Error saving recipe: ' + data.error);
        }
    });
}

function cloneRecipe() {
    if (!currentStudioProductId) {
        alert('Please select a target product first.');
        return;
    }
    var sourceSelect = document.getElementById('clone_source_select');
    var sourceId = sourceSelect.value;

    if (!sourceId) {
        alert('Please select a source product to copy from.');
        return;
    }
    if (sourceId == currentStudioProductId) {
        alert('Cannot copy recipe from the same product.');
        return;
    }

    if (!confirm('Copy all recipe requirements from selected product? Existing requirements for matching materials will be updated.')) return;

    var formData = new FormData();
    formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');
    formData.append('action', 'clone_recipe');
    formData.append('source_product_id', sourceId);
    formData.append('target_product_id', currentStudioProductId);

    fetch("{% url 'save_product_recipe_api' %}", {
        method: 'POST',
        body: formData
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            sourceSelect.value = '';
            switchStudioProduct(currentStudioProductId);
            if (window.location.pathname.includes('/catalog/products/') && !window.location.pathname.endsWith('/products/')) {
                window.location.reload();
            }
        } else {
            alert('Error cloning recipe: ' + data.error);
        }
    });
}
</script>
